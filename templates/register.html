<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Student Management System</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-icon" aria-hidden="true">SMS</div>
        <h1>Create account</h1>
        <p class="login-subtitle">Choose the type of account to create</p>

        <nav class="account-type" aria-label="Account type">
            <a class="account-type-link account-type-selected"
               href="{{ url_for('register') }}" aria-current="page">
                User account
            </a>
            <a class="account-type-link" href="{{ url_for('admin_register') }}">
                Request admin account
            </a>
        </nav>

        <form method="POST" action="{{ url_for('register') }}">
            <label for="username">Username</label>
            <input id="username" type="text" name="username"
                   minlength="3" maxlength="32"
                   autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" type="password" name="password"
                   minlength="8" autocomplete="new-password" required>

            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" type="password"
                   name="confirm_password" minlength="8"
                   autocomplete="new-password" required>

            {% if message %}
                <p class="message login-message" role="alert">{{ message }}</p>
            {% endif %}

            <button type="submit" class="login-button">Create account</button>
        </form>

        <p class="auth-switch">
            Already registered? <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </main>
</body>
</html>
