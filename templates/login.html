<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Management System</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-icon" aria-hidden="true">SMS</div>
        <h1>Welcome back</h1>
        <p class="login-subtitle">Sign in to search student records securely</p>

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <input id="username" type="text" name="username"
                   autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" type="password" name="password"
                   autocomplete="current-password" required>

            {% if message %}
                <p class="message login-message" role="alert">{{ message }}</p>
            {% endif %}

            <button type="submit" class="login-button">Sign in</button>
        </form>

        <p class="auth-switch">
            New here? <a href="{{ url_for('register') }}">Create an account</a>
        </p>
        <p class="auth-switch">
            Administrator? <a href="{{ url_for('admin_login') }}">Admin sign in</a>
        </p>
    </main>
</body>
</html>
